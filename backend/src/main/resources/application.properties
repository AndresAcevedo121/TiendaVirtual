server.port=8081
server.address=0.0.0.0
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Configuración Base de Datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_virtual_local?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (Validar sin alterar tablas existentes)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Políticas de Negocio (Skill 02)
pizzaamericana.tienda.costo-domicilio=5000.00
pizzaamericana.tienda.pedido-minimo=17000.00

# Servicio de Cobertura (servicios-pizzaamericana)
cobertura.url=${COBERTURA_URL}
cobertura.api-key=${COBERTURA_API_KEY}


